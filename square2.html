<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animation</title>
    <style>
        .parent{
             height: 100vh; 
            width: 100vw; 
            /* background-color: aqua; */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            height: 500px;
            width: 500px;
            /* background-color: #fff; */
            border: 4px dotted   black;
            /* position: relative; */
            display: flex;

        }
        .box{
            
            height:60px;
            width:60px;
            /* background-color: antiquewhite; */
            animation: sq 2s linear infinite;
        }
        @keyframes sq {
            0%{background-color: rgb(154, 25, 25);transform: translate(0px,0px) rotate(0deg)}
            25%{background-color: rgb(13, 156, 77);transform: translate(450px,0px) rotate(90deg);}
            50%{background-color: rgb(150, 216, 27);transform: translate(450px,450px) rotate(180deg);}
            75%{background-color: rgb(236, 102, 18);transform: translate(0px,450px) rotate(270deg);}
            100%{background-color: rgb(221, 11, 11);transform: translate(0px,0px) rotate(360deg);}
            
        }
        .box2{
            height:60px;
            width:60px;
            animation: anima 2s linear infinite;
        }
        @keyframes anima{
            /* 0%{background-color: rgb(154, 25, 25);transform: translate(0px,0px) skewX(0deg)} */
            0%{background-color: rgb(13, 156, 77);transform: translate(350px,0px) skewY(0deg);}
            75%{background-color: rgb(150, 216, 27);transform: translate(350px,350px) skewX(30deg);}
            50%{background-color: rgb(236, 102, 18);transform: translate(0px,350px) skewY(40deg);}
            100%{background-color: rgb(221, 11, 11);transform: translate(350px,0px) skewX(50deg);}
            
        }
        /* .circle{
            border: 2px solid black;
            width: 100px;
            height: 100px;
            border-radius: 100%;
            justify-content: center;
            align-items: center;
            
            animation: cir 2s reverse infinite;
        }
        @keyframes cir{
            0%{ border: 2px dottted black;
                  transform: rotate(0deg);}
            50%{
                transform: rotate(180deg);
            }
            100%{
                transform: rotate(360deg);
            } */

        

    </style>
</head>
<body>
    <div class="parent">
        <div class="container">
            <div class="box"></div>
            <div class="box2"></div>
        <!-- <div class="pg">   </div> -->
            <!-- <div class ="circle"></div> -->
        </div>
    </div>
</body>
</html>
